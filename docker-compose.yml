services:
  app:
    build: .
    image: ${IMAGE_REF:-ghcr.io/stevenfackley/{{PROJECT_NAME}}:dev}
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "4321"
      # R2 (S3-compatible). In dev, point at the s3 service below.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9000}
      S3_REGION: auto
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-app-local}
      S3_FORCE_PATH_STYLE: "true"
    ports: ["4321:4321"]
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: unless-stopped

  db:
    # supabase/postgres ships pgcrypto, pgsodium, pg_graphql, pg_stat_statements,
    # pgjwt, pgvector, etc. Matches Supabase Cloud's schema capabilities.
    image: supabase/postgres:15.8.1.060
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  s3:
    # Local S3-compatible storage that mirrors R2's API surface.
    # Prod swaps S3_ENDPOINT to https://<account>.r2.cloudflarestorage.com.
    # RustFS, not MinIO: MinIO stopped publishing public images (Docker Hub
    # and quay.io both 401 anonymous pulls since 2026-09). Apache-2.0,
    # S3-compatible drop-in on the same ports.
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot job: create the local bucket on first boot and make objects
  # anonymously readable (GET only; listing stays denied).
  s3-init:
    image: amazon/aws-cli:2.37.4
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket app-local 2>/dev/null ||
        aws --endpoint-url http://s3:9000 s3api create-bucket --bucket app-local;
        aws --endpoint-url http://s3:9000 s3api put-bucket-policy --bucket app-local --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::app-local/*\"]}]}'
      "
    restart: "no"

volumes:
  pgdata:
  s3data:
