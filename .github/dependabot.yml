version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      astro: { patterns: ["astro", "@astrojs/*"] }
      drizzle: { patterns: ["drizzle-orm", "drizzle-kit"] }
      react: { patterns: ["react", "react-dom", "@types/react*"] }
      test: { patterns: ["vitest", "@vitest/*", "@playwright/*"] }
      lint: { patterns: ["eslint*", "typescript-eslint", "@typescript-eslint/*"] }
    ignore:
      # TypeScript majors are held until the lint toolchain can read them.
      #
      # `@typescript-eslint/typescript-estree` — pulled in by
      # the typescript-eslint meta-package that eslint.config.mjs imports —
      # declares `typescript: ">=4.8.4 <6.1.0"`, and that is still true of
      # 8.68.0, the newest version published as of 2026-08-29. It does not
      # warn and carry on; it exits 2 with "typescript-eslint does not
      # support TS 7.0", so the whole lint step dies and CI is red. `tsc`
      # itself is fine — this is a lint-toolchain ceiling, not a compiler
      # problem.
      #
      # This template merged the 6 -> 7 bump on 2026-08-29 and every repo
      # cut from it after that date was born with `npm run lint` broken.
      # Nothing caught it because a template's own CI cannot run: the
      # `project-name: {{PROJECT_NAME}}` placeholder fails to compile, so
      # the run dies as a 0-job startup_failure that reads like a
      # permanently red X rather than a signal. Drop this block once
      # typescript-eslint supports TS 7, and take the bump deliberately.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
