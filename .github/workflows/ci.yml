name: ci

on:
  pull_request:
  push: { branches: [main] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: github.repository != 'stevenfackley/repo-template-astro-supabase'
    uses: stevenfackley/gh-actions/.github/workflows/ci-astro.yml@v1
    with:
      project-name: "{{PROJECT_NAME}}"
      node-version: "22"
      workspace: ""
      run-e2e: true
      health-path: /healthz
      port: "4321"
    secrets: inherit

  secret-scan:
    if: github.repository != 'stevenfackley/repo-template-astro-supabase'
    uses: stevenfackley/gh-actions/.github/workflows/secret-scan.yml@v1
    with:
      # The whole tree. A folder list ("src scripts db") skips every other folder and every file at the root.
      # The shared workflow already leaves out docs/, .claude/ and the scanner's own pattern table.
      paths: "."
